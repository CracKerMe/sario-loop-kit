packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
# ts-workflow-engine-lite's optional REST-API peers (express, cors, helmet,
# etc.) are never used here — Loopkit exposes its own Hono API and never
# imports createWorkflowRouter/startApiServer.
peerDependencyRules:
  ignoreMissing:
    - express
    - body-parser
    - cors
    - express-validator
    - helmet
    - morgan
    - swagger-ui-dist
    - ws
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6.0.3
  "@types/node": ^26.2.0
  better-auth: 1.7.1
  evlog: ^2.27.1
  lucide-react: ^1.27.0
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  sonner: ^2.0.7
  tailwindcss: ^4.3.3
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  drizzle-orm: ^0.45.2
