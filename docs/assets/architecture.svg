<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#E4E0D5"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1F2430" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA0AC"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#F6F4EE"/>
  <rect width="1200" height="640" fill="url(#dots)"/>

  <!-- Title block -->
  <text x="40" y="46" font-size="22" font-weight="700" fill="#1F2430">Loopkit architecture</text>
  <text x="40" y="68" font-size="13" fill="#6D7280">Journeys compile to durable workflow-engine runs — not a fixed set of marketing nodes</text>

  <!-- apps/web -->
  <g filter="url(#soft)">
    <rect x="40" y="100" width="230" height="86" rx="12" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="40" y="100" width="230" height="6" rx="3" fill="#8B5CF6"/>
  <text x="60" y="132" font-size="14" font-weight="700" fill="#1F2430">apps/web</text>
  <text x="60" y="150" font-size="11.5" fill="#6D7280">TanStack Start dashboard</text>
  <text x="60" y="166" font-size="11.5" fill="#6D7280">React Flow journey builder</text>

  <!-- apps/server -->
  <g filter="url(#soft)">
    <rect x="330" y="100" width="230" height="86" rx="12" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="330" y="100" width="230" height="6" rx="3" fill="#4F46E5"/>
  <text x="350" y="132" font-size="14" font-weight="700" fill="#1F2430">apps/server</text>
  <text x="350" y="150" font-size="11.5" fill="#6D7280">Hono API · ingestion · webhooks</text>
  <text x="350" y="166" font-size="11.5" fill="#6D7280">single-instance advisory lock</text>

  <!-- external clients -->
  <g filter="url(#soft)">
    <rect x="930" y="100" width="230" height="86" rx="12" fill="#FFFFFF" stroke="#E3E0D6" stroke-dasharray="4 3"/>
  </g>
  <text x="950" y="132" font-size="14" font-weight="700" fill="#1F2430">Your app</text>
  <text x="950" y="150" font-size="11.5" fill="#6D7280">POST /v1/contacts · /v1/events</text>
  <text x="950" y="166" font-size="11.5" fill="#6D7280">POST /v1/transactional</text>

  <line x1="270" y1="143" x2="330" y2="143" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="930" y1="143" x2="562" y2="143" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- packages/journey + core row -->
  <g filter="url(#soft)">
    <rect x="140" y="240" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="140" y="240" width="220" height="6" rx="3" fill="#EC4899"/>
  <text x="160" y="270" font-size="13.5" font-weight="700" fill="#1F2430">packages/journey</text>
  <text x="160" y="288" font-size="11" fill="#6D7280">graph → compile() / decompile()</text>
  <text x="160" y="303" font-size="11" fill="#6D7280">validateGraph · node whitelist</text>

  <g filter="url(#soft)">
    <rect x="400" y="240" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="400" y="240" width="220" height="6" rx="3" fill="#3B82F6"/>
  <text x="420" y="270" font-size="13.5" font-weight="700" fill="#1F2430">packages/core</text>
  <text x="420" y="288" font-size="11" fill="#6D7280">contacts · journeys · triggers</text>
  <text x="420" y="303" font-size="11" fill="#6D7280">audiences (SegmentFilter → SQL)</text>

  <g filter="url(#soft)">
    <rect x="660" y="240" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="660" y="240" width="220" height="6" rx="3" fill="#10B981"/>
  <text x="680" y="270" font-size="13.5" font-weight="700" fill="#1F2430">packages/email</text>
  <text x="680" y="288" font-size="11" fill="#6D7280">EmailProvider · Resend bridge</text>
  <text x="680" y="303" font-size="11" fill="#6D7280">rate limit · frequency cap</text>

  <g filter="url(#soft)">
    <rect x="920" y="240" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="920" y="240" width="220" height="6" rx="3" fill="#F59E0B"/>
  <text x="940" y="270" font-size="13.5" font-weight="700" fill="#1F2430">packages/timers</text>
  <text x="940" y="288" font-size="11" fill="#6D7280">Postgres external timers</text>
  <text x="940" y="303" font-size="11" fill="#6D7280">restart-safe wait poller</text>

  <line x1="445" y1="186" x2="250" y2="240" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="186" x2="510" y2="240" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="186" x2="770" y2="240" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="445" y1="186" x2="1020" y2="240" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- engine -->
  <g filter="url(#soft)">
    <rect x="300" y="400" width="420" height="96" rx="14" fill="#1F2430"/>
  </g>
  <text x="330" y="436" font-size="15" font-weight="700" fill="#FFFFFF">ts-workflow-engine-lite</text>
  <text x="330" y="456" font-size="11.5" fill="#B8BDC9">bootstrap · EventWaitIndex · contact-event wake-ups</text>
  <text x="330" y="474" font-size="11.5" fill="#B8BDC9">durable waits · retries · dead-letter queue</text>

  <line x1="250" y1="322" x2="420" y2="400" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="322" x2="480" y2="400" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="322" x2="560" y2="400" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1020" y1="322" x2="640" y2="400" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- storage -->
  <g filter="url(#soft)">
    <rect x="360" y="550" width="300" height="70" rx="12" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="360" y="550" width="300" height="6" rx="3" fill="#4F46E5"/>
  <text x="380" y="580" font-size="13.5" font-weight="700" fill="#1F2430">packages/engine-storage</text>
  <text x="380" y="598" font-size="11" fill="#6D7280">Drizzle / Postgres StorageProvider — one database, single writer</text>

  <line x1="510" y1="496" x2="510" y2="550" stroke="#9CA0AC" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
