<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dots2" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E4E0D5"/>
    </pattern>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="3" flood-color="#1F2430" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B7BBC4"/>
    </marker>
  </defs>

  <rect width="1000" height="540" fill="#FBFAF6"/>
  <rect width="1000" height="540" fill="url(#dots2)"/>

  <!-- toolbar chrome -->
  <rect x="0" y="0" width="1000" height="44" fill="#FFFFFF"/>
  <line x1="0" y1="44" x2="1000" y2="44" stroke="#EAE7DC"/>
  <text x="24" y="27" font-size="13.5" font-weight="700" fill="#1F2430">Welcome drip</text>
  <rect x="850" y="12" width="58" height="20" rx="10" fill="#F5EFFF"/>
  <text x="879" y="26" font-size="10.5" fill="#8B5CF6" text-anchor="middle" font-weight="600">Valid</text>
  <rect x="918" y="12" width="62" height="20" rx="6" fill="#4F46E5"/>
  <text x="949" y="26" font-size="10.5" fill="#FFFFFF" text-anchor="middle" font-weight="600">Publish</text>

  <!-- connectors -->
  <g stroke="#C7CAD2" stroke-width="1.6" fill="none">
    <path d="M500,116 V142" marker-end="url(#arrow2)"/>
    <path d="M500,202 V228" marker-end="url(#arrow2)"/>
    <path d="M500,288 V314" marker-end="url(#arrow2)"/>
    <path d="M500,374 V400" marker-end="url(#arrow2)"/>
  </g>

  <!-- Trigger -->
  <g filter="url(#soft2)">
    <rect x="420" y="60" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="420" y="60" width="6" height="56" rx="3" fill="#8B5CF6"/>
  <circle cx="446" cy="80" r="4" fill="#8B5CF6"/>
  <text x="460" y="84" font-size="12" font-weight="700" fill="#1F2430">Trigger</text>
  <text x="440" y="102" font-size="10" fill="#8A8E99">contact created</text>

  <!-- Email: Welcome -->
  <g filter="url(#soft2)">
    <rect x="420" y="146" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="420" y="146" width="6" height="56" rx="3" fill="#10B981"/>
  <circle cx="446" cy="166" r="4" fill="#10B981"/>
  <text x="460" y="170" font-size="12" font-weight="700" fill="#1F2430">Email</text>
  <text x="440" y="188" font-size="10" fill="#8A8E99">Welcome aboard</text>

  <!-- Delay -->
  <g filter="url(#soft2)">
    <rect x="420" y="232" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="420" y="232" width="6" height="56" rx="3" fill="#F59E0B"/>
  <circle cx="446" cy="252" r="4" fill="#F59E0B"/>
  <text x="460" y="256" font-size="12" font-weight="700" fill="#1F2430">Delay</text>
  <text x="440" y="274" font-size="10" fill="#8A8E99">wait 1 day</text>

  <!-- Email: Tips -->
  <g filter="url(#soft2)">
    <rect x="420" y="318" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="420" y="318" width="6" height="56" rx="3" fill="#10B981"/>
  <circle cx="446" cy="338" r="4" fill="#10B981"/>
  <text x="460" y="342" font-size="12" font-weight="700" fill="#1F2430">Email</text>
  <text x="440" y="360" font-size="10" fill="#8A8E99">Getting started tips</text>

  <!-- Exit -->
  <g filter="url(#soft2)">
    <rect x="420" y="404" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#E3E0D6"/>
  </g>
  <rect x="420" y="404" width="6" height="56" rx="3" fill="#EC4899"/>
  <circle cx="446" cy="424" r="4" fill="#EC4899"/>
  <text x="460" y="428" font-size="12" font-weight="700" fill="#1F2430">Exit</text>
  <text x="440" y="446" font-size="10" fill="#8A8E99">journey complete</text>

  <!-- default-template annotation -->
  <text x="640" y="238" font-size="11" font-weight="600" fill="#8A8E99">Default template</text>
  <text x="640" y="254" font-size="10.5" fill="#8A8E99">core palette: Trigger · Email ·</text>
  <text x="640" y="268" font-size="10.5" fill="#8A8E99">Delay · Filter · Branch · A/B</text>

  <!-- footer status bar -->
  <line x1="0" y1="498" x2="1000" y2="498" stroke="#EAE7DC"/>
  <text x="24" y="520" font-size="10.5" fill="#8A8E99">5 nodes · 4 edges</text>
  <circle cx="905" cy="515" r="4" fill="#10B981"/>
  <text x="915" y="520" font-size="10.5" fill="#3F8E5C" font-weight="600">Graph looks valid</text>
</svg>
