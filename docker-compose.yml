name: loopkit

services:
  # ⚠️ SINGLE INSTANCE ONLY. Never `--scale server=2`, never `deploy.replicas`
  # > 1, never a multi-replica orchestrator. The workflow engine's event bus,
  # timer ownership, leases, idempotency keys and Cron scheduling are all
  # process-local, so a second instance would double-fire waits and
  # double-send email. apps/server enforces this with a Postgres advisory
  # lock and exits non-zero if another instance holds it. See README
  # "Deployment: one API server per database".
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    # Explicit, and deliberately not parameterized/overridable.
    deploy:
      replicas: 1
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/loopkit
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: loopkit-postgres
    environment:
      POSTGRES_DB: loopkit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - loopkit_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  loopkit_postgres_data:
